[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presplit-audit"
version = "0.2.0"
description = "Compare cross-validated AUCs when a supervised feature step is fitted before or within the split"
readme = "README.md"
license = "BSD-3-Clause"
authors = [{name = "Cheng Zhang"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "joblib>=1.2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
presplit-audit = "presplit_audit.cli:main"
presplit-risk = "presplit_audit.risk:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
presplit_audit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
